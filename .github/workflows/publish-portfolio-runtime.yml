name: Publish Portfolio Runtime

on:
  push:
    branches:
      - ramzy/phase1-integration
    paths:
      - "apps/client/src/portfolio-runtime/**"
      - "apps/client/src/features/editor/**"
      - "apps/client/src/lib/**"
      - "apps/client/vite.portfolio-runtime.config.ts"
      - "packages/editor-ext/**"
      - "scripts/publish-portfolio-runtime.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-portfolio-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ramzy-portfolio-runtime-publish
  cancel-in-progress: true

jobs:
  publish-dist-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The publisher creates a temporary Git repository for the distributable.
      # Configure the GitHub CLI credential helper globally so that temporary
      # repository can push through the same authenticated GitHub Actions token.
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Build, validate, and publish portfolio runtime
        run: pnpm run portfolio-runtime:publish-git
