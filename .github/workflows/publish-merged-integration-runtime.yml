name: Publish Validated Integration Runtime

on:
  workflow_run:
    workflows:
      - Ramzy Studio Quality
    types:
      - completed
    branches:
      - ramzy/phase1-integration

permissions:
  contents: write

concurrency:
  group: ramzy-portfolio-runtime-release
  cancel-in-progress: false

jobs:
  publish-runtime:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'ramzy/phase1-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout validated integration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Build, validate, and publish immutable portfolio runtime
        run: pnpm run portfolio-runtime:publish-git
