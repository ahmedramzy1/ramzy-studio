name: Diagnose ProseMirror Runtime

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'ramzy/fix-runtime-prosemirror-singletons'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show ProseMirror dependency and resolver paths
        shell: bash
        run: |
          echo '=== pnpm why prosemirror-view ==='
          pnpm why -r prosemirror-view || true
          echo
          echo '=== real prosemirror-view package directories ==='
          find node_modules/.pnpm -maxdepth 1 -type d -name 'prosemirror-view@*' -printf '%f\n' | sort
          echo
          echo '=== client resolver paths ==='
          pnpm --filter ./apps/client exec node - <<'NODE'
          const { createRequire } = require('node:module')
          const path = require('node:path')
          const req = createRequire(path.resolve('apps/client/package.json'))
          for (const id of [
            'prosemirror-view',
            '@tiptap/pm/view',
            'prosemirror-state',
            '@tiptap/pm/state',
            'prosemirror-model',
            '@tiptap/pm/model',
          ]) {
            try {
              console.log(id, '=>', req.resolve(id))
            } catch (error) {
              console.log(id, '=> RESOLVE ERROR:', error.message)
            }
          }
          NODE

      - name: Build embedded runtime
        run: pnpm run portfolio-runtime:build

      - name: Inspect duplicated decoration implementation
        shell: bash
        run: |
          echo '=== files containing localsInner ==='
          grep -RIl 'localsInner' apps/client/dist-portfolio-runtime --include='*.mjs' --include='*.js' || true
          echo
          echo '=== localsInner occurrences ==='
          grep -Rno 'localsInner' apps/client/dist-portfolio-runtime --include='*.mjs' --include='*.js' || true
          echo
          echo '=== prosemirror-view source markers ==='
          grep -Rno 'prosemirror-view@[^/]*/node_modules/prosemirror-view' apps/client/dist-portfolio-runtime --include='*.mjs' --include='*.js' || true
          echo
          echo '=== @tiptap/pm source markers ==='
          grep -Rno '@tiptap+pm@[^/]*/node_modules/@tiptap/pm' apps/client/dist-portfolio-runtime --include='*.mjs' --include='*.js' || true
          echo
          FILE="$(grep -RIl 'localsInner' apps/client/dist-portfolio-runtime --include='*.mjs' --include='*.js' | head -n 1)"
          if [ -n "$FILE" ]; then
            echo "=== source regions near first DecorationSet copy in $FILE ==="
            sed -n '8900,9080p' "$FILE" || true
            echo
            echo '=== source regions near second DecorationSet copy ==='
            sed -n '23390,23590p' "$FILE" || true
            echo
            echo '=== nearest //#region markers around both ranges ==='
            awk 'NR<=9080 && /#region/ {print NR ":" $0}' "$FILE" | tail -n 12 || true
            awk 'NR<=23590 && /#region/ {print NR ":" $0}' "$FILE" | tail -n 12 || true
          fi
