name: Ramzy Studio Quality

on:
  push:
    branches:
      - main
      - ramzy/phase1-integration
      - ramzy/aura-capability-rebuild
  pull_request:
    types: [opened, synchronize, reopened]

# PR runs validate only. A successful push to the integration branch publishes
# the exact validated commit through the write-scoped publish-runtime job below.
permissions:
  contents: read

concurrency:
  group: ramzy-studio-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor extensions
        run: pnpm run editor-ext:build

      - name: Lint runtime build configuration
        run: pnpm --filter ./apps/client exec eslint vite.portfolio-runtime.config.ts

      - name: Test portfolio draft save + capability showcase contracts
        run: pnpm --filter ./apps/client exec vitest run src/features/editor/portfolio/portfolio-draft-save.test.ts src/features/editor/portfolio/capability-showcase.test.ts

      - name: Test media authoring contract
        run: pnpm --filter ./apps/client exec vitest run src/features/editor/components/media/media-authoring-actions.test.ts src/features/editor/components/media/media-session.test.ts src/features/editor/components/video/video-layout.test.ts

      - name: Build client
        run: pnpm --filter ./apps/client run build

      - name: Validate packaged portfolio runtime
        run: node scripts/publish-portfolio-runtime.mjs --check

      - name: Upload validated portfolio runtime
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-runtime-${{ github.sha }}
          path: apps/client/dist-portfolio-runtime
          if-no-files-found: error
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor extensions
        run: pnpm run editor-ext:build

      - name: Test portfolio server contract
        run: pnpm --filter ./apps/server exec jest src/integrations/portfolio/portfolio.controller.spec.ts --runInBand

      - name: Build server
        run: pnpm --filter ./apps/server run build

  publish-runtime:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/ramzy/phase1-integration' ||
       github.ref == 'refs/heads/ramzy/aura-capability-rebuild')
    needs: [editor-client, server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout validated integration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git authentication
        env:
          RAMZY_RUNTIME_PUSH_TOKEN: ${{ github.token }}
        run: git remote set-url origin "https://x-access-token:${RAMZY_RUNTIME_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Build, validate, and publish immutable portfolio runtime
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run portfolio-runtime:publish-git 2>&1 | tee publish.log

      - name: Record runtime publish failure
        if: steps.publish.outcome == 'failure'
        shell: bash
        run: |
          tail -n 300 publish.log > .github/portfolio-runtime-publish-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/portfolio-runtime-publish-failure.log
          git commit -m "Record portfolio runtime publish failure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1

      - name: Remove stale runtime publish failure log after recovery
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          if [ -f .github/portfolio-runtime-publish-failure.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/portfolio-runtime-publish-failure.log
            git commit -m "Clear portfolio runtime publish failure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail workflow when publish failed
        if: steps.publish.outcome == 'failure'
        run: exit 1
