name: Ramzy Studio Quality

on:
  push:
    branches:
      - main
      - ramzy/phase1-integration
  pull_request:
    types: [opened, synchronize, reopened]

# Successful integration push runs trigger the default-branch workflow_run publisher.
permissions:
  contents: read

concurrency:
  group: ramzy-studio-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor extensions
        run: pnpm run editor-ext:build

      - name: Lint runtime build configuration
        run: pnpm --filter ./apps/client exec eslint vite.portfolio-runtime.config.ts

      - name: Test portfolio draft save contract
        run: pnpm --filter ./apps/client exec vitest run src/features/editor/portfolio/portfolio-draft-save.test.ts

      - name: Build client
        run: pnpm --filter ./apps/client run build

      - name: Validate packaged portfolio runtime
        run: node scripts/publish-portfolio-runtime.mjs --check

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor extensions
        run: pnpm run editor-ext:build

      - name: Test portfolio server contract
        run: pnpm --filter ./apps/server exec jest src/integrations/portfolio/portfolio.controller.spec.ts --runInBand

      - name: Build server
        run: pnpm --filter ./apps/server run build
