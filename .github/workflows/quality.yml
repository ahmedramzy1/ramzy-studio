name: Ramzy Studio Quality

on:
  push:
    branches:
      - main
      - ramzy/phase1-integration
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: ramzy-studio-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor extensions
        run: pnpm run editor-ext:build

      - name: Lint runtime build configuration
        run: pnpm --filter ./apps/client exec eslint vite.portfolio-runtime.config.ts

      - name: Test portfolio draft save contract
        run: pnpm --filter ./apps/client exec vitest run src/features/editor/portfolio/portfolio-draft-save.test.ts

      - name: Build client
        run: pnpm --filter ./apps/client run build

      - name: Validate packaged portfolio runtime
        run: node scripts/publish-portfolio-runtime.mjs --check

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor extensions
        run: pnpm run editor-ext:build

      - name: Test portfolio server contract
        run: pnpm --filter ./apps/server exec jest src/integrations/portfolio/portfolio.controller.spec.ts --runInBand

      - name: Build server
        run: pnpm --filter ./apps/server run build

  publish-runtime:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'ramzy/phase1-integration'
    needs: [editor-client, server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout validated integration source
        uses: actions/checkout@v4
        with:
          ref: ramzy/phase1-integration

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Build, validate, and publish portfolio runtime
        run: pnpm run portfolio-runtime:publish-git
